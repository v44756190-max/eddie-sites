<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eddie Munson</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle at top, #140000, #000);
    color: white;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    overflow-x: hidden;
}

/* HEADER */
header {
    padding: 40px 20px;
}

header h1 {
    color: red;
    font-size: 44px;
    letter-spacing: 5px;
    text-shadow:
        0 0 10px red,
        0 0 20px red,
        0 0 40px crimson;
    animation: flicker 2.5s infinite;
}

header p {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.8;
}

/* NEON LINE */
.line {
    width: 100%;
    height: 2px;
    background: red;
    box-shadow: 0 0 20px red;
    margin: 30px 0;
}

/* IMAGE */
.image-box {
    width: 320px;
    margin: 50px auto;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 0 25px red;
    animation: pulse 3s infinite;
}

.image-box img {
    width: 100%;
    border-radius: 8px;
}

/* BUTTON */
.button {
    width: 340px;
    margin: 40px auto;
    padding: 22px;
    border: 2px solid red;
    border-radius: 14px;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 20px red;
    transition: 0.3s;
    font-size: 16px;
}

.button:hover {
    background: red;
    color: black;
    box-shadow: 0 0 40px red;
}

/* GLITCH */
.glitch {
    position: relative;
}

.glitch::before,
.glitch::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    width: 100%;
    opacity: 0.7;
}

.glitch::before {
    color: red;
    animation: glitch 2s infinite;
}

.glitch::after {
    color: crimson;
    animation: glitch 1.5s infinite reverse;
}

/* FOOTER */
footer {
    margin: 70px 0 25px;
    font-size: 12px;
    opacity: 0.7;
}

/* ANIMATIONS */
@keyframes pulse {
    0% { box-shadow: 0 0 15px red; }
    50% { box-shadow: 0 0 40px red; }
    100% { box-shadow: 0 0 15px red; }
}

@keyframes flicker {
    0%, 100% { opacity: 1; }
    45% { opacity: 0.85; }
    50% { opacity: 0.6; }
    55% { opacity: 1; }
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(2px, -2px); }
    60% { transform: translate(-1px, 1px); }
    80% { transform: translate(1px, -1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<header>
    <h1 class="glitch" data-text="EDDIE MUNSON">EDDIE MUNSON</h1>
    <p>Stranger Things • Chaos • Metal</p>
</header>

<div class="line"></div>

<div class="image-box">
    <img src="stranger-things.jpg" alt="Stranger Things">
</div>

<div class="button" onclick="playMusic()">
    ▶ THIS IS MUSIC!
</div>

<footer>
    © 2026 Eddie Munson | Hellfire Club 🔥
</footer>

<audio id="music" src="music.mp3"></audio>

<script>
function playMusic() {
    const audio = document.getElementById("music");
    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
}
</script>

</body>
</html>
